version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: node dist/server.cjs
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: AWS_REGION
      value: YOUR_AWS_REGION
    - name: S3_BUCKET_NAME
      value: paper-reviewer-storage
    - name: DYNAMODB_TABLE_NAME
      value: PaperReviewerSessions
