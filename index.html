<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.global = window;
          try {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // Ignore if fetch property cannot be redefined
          }
        }
      })();
    </script>
